<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KtPay</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="page3.css"/>
</head>
<body>
  
  <div id="page1" class="page active">
    <article class="home-page">
      <header>
        <div>
          <img src="photo/ktpay.png" alt="ktpay logo" class="img-symbol"/>
          <div>
            <span>user234</span>
          </div>
        </div>
        
        <a><i class="fa-solid fa-bell"></i></a>
      </header>
      
      <div class="cat-balance">
        <div>
          <span>My Balance</span>
          <span style="font-size: 10px">$ <span id="balance" style="font-size: 20px">0</span></span>
        </div>
        <button id="deposit">Deposit</button>
      </div>
      
      <div class="coins-list">
        <div id="coins"></div>
      </div>
    </article>
  </div>
  
  
  <div id="page2" class="page">
    
  </div>
  
  
  
  
  
<div id="page3" class="page">
  <article class="home-page3">
    <header class="page3-thead">
      <span>Asset</span>
      <div class="line"></div>
      <a><i class="fa-solid fa-gear"></i></a>
    </header>
    
    
    
    <div class="wallet-cat">
      <div>
        <span>My Wallet</span>
      <span id="balance">$ 0.00</span>
      </div>
      
      <span id="ngn" class="ngn">&#8358; 0.00 NGN</span>
    </div>
    
    
    
    
    <div class="send-container">
      <button>
        <i class="fa-solid fa-arrow-down"></i>
        Recive
      </button>
      <button>
        <i class="fa-solid fa-arrow-up"></i>
        Send
      </button>
    </div>
    
    <div class="asset-list">
      <div id="coin-asset"></div>
    </div>
  </article>
</div>
  
  
  
  
  
  
  
  
  
  
  
  
<footer>
 <nav>
  <a onclick="navigate('page1')">
    <i class="fa-solid fa-house"></i>Home</a>
      
      
  <a onclick="navigate('page2')">
    <i class="fa-solid fa-history"></i>History</a>
      
      
  <a onclick="navigate('page3')">
    <i class="fa-solid fa-wallet"></i>Asset</a>
    </nav>
  </footer>
  
  <script src="navigate.js"></script>
  <script type="module" src="getCoins.js"></script>
  <script type="module" src="ui.js"></script>
  <script type="module" src="coins.js"></script>
  
  <script type="module" src="getPrice.js"></script>
  
  
  
  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</body>
</html>
